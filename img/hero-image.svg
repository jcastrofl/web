<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="50" fill="#4361ee" opacity="0.1"/>
  <circle cx="700" cy="500" r="70" fill="#4361ee" opacity="0.1"/>
  <circle cx="650" cy="150" r="40" fill="#4361ee" opacity="0.1"/>
  <circle cx="200" cy="450" r="60" fill="#4361ee" opacity="0.1"/>
  
  <!-- Main Computer/Laptop -->
  <rect x="300" y="200" width="240" height="160" rx="5" ry="5" fill="#333" stroke="#222" stroke-width="2"/>
  <rect x="310" y="210" width="220" height="140" fill="#111"/>
  
  <!-- Computer Base -->
  <path d="M280 360 L560 360 L580 390 L260 390 Z" fill="#444"/>
  <rect x="260" y="390" width="320" height="10" rx="2" ry="2" fill="#333"/>
  
  <!-- Screen Content: Code Editor -->
  <rect x="320" y="220" width="200" height="120" fill="#1e1e1e"/>
  
  <!-- Code Lines -->
  <rect x="320" y="220" width="30" height="120" fill="#252525"/>
  
  <!-- Line Numbers -->
  <text x="335" y="235" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">1</text>
  <text x="335" y="250" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">2</text>
  <text x="335" y="265" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">3</text>
  <text x="335" y="280" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">4</text>
  <text x="335" y="295" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">5</text>
  <text x="335" y="310" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">6</text>
  <text x="335" y="325" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">7</text>
  
  <!-- Code Text -->
  <text x="355" y="235" font-family="monospace" font-size="10" fill="#ce9178">// Cybersecurity</text>
  <text x="355" y="250" font-family="monospace" font-size="10" fill="#569cd6">function</text>
  <text x="405" y="250" font-family="monospace" font-size="10" fill="#dcdcaa">secureSystem</text>
  <text x="475" y="250" font-family="monospace" font-size="10" fill="#d4d4d4">() {</text>
  <text x="355" y="265" font-family="monospace" font-size="10" fill="#9cdcfe">  const</text>
  <text x="390" y="265" font-family="monospace" font-size="10" fill="#4fc1ff">firewall</text>
  <text x="435" y="265" font-family="monospace" font-size="10" fill="#d4d4d4">= </text>
  <text x="445" y="265" font-family="monospace" font-size="10" fill="#b5cea8">true</text>
  <text x="470" y="265" font-family="monospace" font-size="10" fill="#d4d4d4">;</text>
  <text x="355" y="280" font-family="monospace" font-size="10" fill="#c586c0">  return</text>
  <text x="400" y="280" font-family="monospace" font-size="10" fill="#ce9178">"Protected!"</text>
  <text x="355" y="295" font-family="monospace" font-size="10" fill="#d4d4d4">}</text>
  <text x="355" y="310" font-family="monospace" font-size="10" fill="#dcdcaa">secureSystem</text>
  <text x="430" y="310" font-family="monospace" font-size="10" fill="#d4d4d4">();</text>
  
  <!-- Floating Elements: Database Symbol -->
  <rect x="150" y="250" width="80" height="100" rx="5" ry="5" fill="#4361ee" opacity="0.8"/>
  <rect x="150" y="250" width="80" height="20" rx="5" ry="5" fill="#3f37c9"/>
  <rect x="150" y="280" width="80" height="10" fill="#3f37c9" opacity="0.7"/>
  <rect x="150" y="300" width="80" height="10" fill="#3f37c9" opacity="0.7"/>
  <rect x="150" y="320" width="80" height="10" fill="#3f37c9" opacity="0.7"/>
  <text x="190" y="265" font-family="Arial" font-size="12" fill="white" text-anchor="middle">DATABASE</text>
  
  <!-- Programming Symbol -->
  <rect x="600" y="230" width="100" height="120" rx="5" ry="5" fill="#4361ee" opacity="0.8"/>
  <text x="650" y="260" font-family="monospace" font-size="14" fill="white" text-anchor="middle">&lt;/&gt;</text>
  <text x="650" y="290" font-family="Arial" font-size="12" fill="white" text-anchor="middle">PROGRAM</text>
  <text x="650" y="310" font-family="Arial" font-size="12" fill="white" text-anchor="middle">ACIÓN</text>
  
  <!-- IT Management Symbol -->
  <circle cx="180" cy="150" r="40" fill="#4361ee" opacity="0.8"/>
  <text x="180" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">GESTIÓN</text>
  <text x="180" y="165" font-family="Arial" font-size="12" fill="white" text-anchor="middle">DE TI</text>
  
  <!-- Cybersecurity Symbol: Shield -->
  <path d="M650 350 L620 370 L620 410 L650 430 L680 410 L680 370 Z" fill="#4361ee" opacity="0.8"/>
  <path d="M650 360 L630 375 L630 405 L650 420 L670 405 L670 375 Z" fill="#f8f9fa"/>
  <text x="650" y="395" font-family="Arial" font-size="12" fill="#4361ee" text-anchor="middle">CIBER</text>
  
  <!-- Connection Lines -->
  <line x1="230" y1="300" x2="300" y2="300" stroke="#4361ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="540" y1="280" x2="600" y2="280" stroke="#4361ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="200" x2="400" y2="150" stroke="#4361ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="150" x2="220" y2="150" stroke="#4361ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="440" y1="360" x2="440" y2="430" stroke="#4361ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="440" y1="430" x2="620" y2="390" stroke="#4361ee" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Students -->
  <circle cx="480" y="480" r="30" fill="#4361ee"/>
  <circle cx="480" y="450" r="15" fill="#4361ee"/>
  <circle cx="380" y="490" r="30" fill="#4361ee" opacity="0.7"/>
  <circle cx="380" y="460" r="15" fill="#4361ee" opacity="0.7"/>
  <circle cx="580" y="490" r="30" fill="#4361ee" opacity="0.7"/>
  <circle cx="580" y="460" r="15" fill="#4361ee" opacity="0.7"/>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial" font-size="30" font-weight="bold" fill="#333" text-anchor="middle">TechLearn Academy</text>
  <text x="400" y="120" font-family="Arial" font-size="18" fill="#666" text-anchor="middle">Cursos de especialización tecnológica</text>
</svg> 